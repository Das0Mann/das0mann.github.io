"/lecture/electronic-structure/":
  builds_on:
    - label: "Start here"
      url: "/lecture/"
  leads_to:
    - label: "Spin Hamiltonians"
      url: "/lecture/spin-hamiltonians/"
    - label: "Excited-State Photochemistry"
      url: "/lecture/excited-state-photochemistry/"
    - label: "Electron Transfer"
      url: "/lecture/electron-transfer/"
  note: "Home of the many-electron problem: states, densities and response properties are calculated here before they are reduced to effective magnetic or photochemical parameters."

"/lecture/spin-hamiltonians/":
  builds_on:
    - label: "Electronic Structure"
      url: "/lecture/electronic-structure/"
  leads_to:
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
    - label: "Molecular Motion"
      url: "/lecture/molecular-motion/"
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
  note: "Home of the effective magnetic model: this module defines the operators, coefficients, units, tensor frames and sign conventions that all later spin calculations inherit."

"/lecture/spin-dynamics/":
  builds_on:
    - label: "Spin Hamiltonians"
      url: "/lecture/spin-hamiltonians/"
  leads_to:
    - label: "Molecular Motion"
      url: "/lecture/molecular-motion/"
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
  note: "Home of coherent time evolution and phenomenological T1/T2 language. Microscopic fluctuation statistics and relaxation generators are deliberately deferred to Modules 07 and 09."

"/lecture/molecular-motion/":
  builds_on:
    - label: "Spin Hamiltonians"
      url: "/lecture/spin-hamiltonians/"
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
  leads_to:
    - label: "Open Systems"
      url: "/lecture/open-systems/"
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
  note: "Home of trajectory-to-Hamiltonian mapping, correlation functions and spectral densities: R(t) becomes p_k(t), then C(t), then J(ω)."

"/lecture/open-systems/":
  builds_on:
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
    - label: "Molecular Motion"
      url: "/lecture/molecular-motion/"
  leads_to:
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of microscopic irreversibility: this module turns fluctuation statistics into relaxation, dephasing, stochastic trajectories or memory kernels."

"/lecture/excited-state-photochemistry/":
  builds_on:
    - label: "Electronic Structure"
      url: "/lecture/electronic-structure/"
  leads_to:
    - label: "Electron Transfer"
      url: "/lecture/electron-transfer/"
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of photoexcited-state preparation, nonadiabatic coupling and intersystem crossing: this is where the reactive electronic state is created."

"/lecture/electron-transfer/":
  builds_on:
    - label: "Electronic Structure"
      url: "/lecture/electronic-structure/"
    - label: "Photochemistry"
      url: "/lecture/excited-state-photochemistry/"
  leads_to:
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of the charge-transfer rate: electronic coupling and nuclear reorganization are combined here to determine how quickly radical or charge-separated states are formed."

"/lecture/radical-pairs/":
  builds_on:
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
    - label: "Electron Transfer"
      url: "/lecture/electron-transfer/"
    - label: "Open Systems"
      url: "/lecture/open-systems/"
  leads_to:
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of singlet-triplet chemistry: coherent spin evolution, relaxation and spin-selective kinetics are combined here to produce reaction yields."

"/lecture/magnetic-resonance/":
  builds_on:
    - label: "Spin Hamiltonians"
      url: "/lecture/spin-hamiltonians/"
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
    - label: "Open Systems"
      url: "/lecture/open-systems/"
  leads_to:
    - label: "Coherent Control"
      url: "/lecture/coherent-control/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of spectroscopic readout: eigenvalue differences, transition matrix elements, populations, anisotropy and relaxation become resonance positions, intensities and linewidths."

"/lecture/coherent-control/":
  builds_on:
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
  leads_to:
    - label: "MolSpin Examples"
      url: "/lecture/molspin-notebooks/"
    - label: "Quantum Biology"
      url: "/lecture/quantum-biology/"
  note: "Home of deliberate time-dependent driving: pulse amplitude, phase, frequency and duration are used to steer the same spin coherences that magnetic resonance detects."

"/lecture/quantum-biology/":
  builds_on:
    - label: "Photochemistry"
      url: "/lecture/excited-state-photochemistry/"
    - label: "Electron Transfer"
      url: "/lecture/electron-transfer/"
    - label: "Radical Pairs"
      url: "/lecture/radical-pairs/"
    - label: "Open Systems"
      url: "/lecture/open-systems/"
  leads_to:
    - label: "Magnetic Resonance"
      url: "/lecture/magnetic-resonance/"
    - label: "Molecular Motion"
      url: "/lecture/molecular-motion/"
  note: "Integration module: it does not re-derive the component theories, but tests whether state preparation, spin dynamics, relaxation, chemistry and biological readout form one quantitatively closed mechanism."

"/lecture/computational-lab/":
  builds_on:
    - label: "Spin Dynamics"
      url: "/lecture/spin-dynamics/"
  leads_to:
