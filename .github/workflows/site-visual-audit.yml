name: Cross-page browser visual audit
on:
  pull_request:
    paths:
      - '.github/workflows/site-visual-audit.yml'
      - 'tests/site-visual-audit.cjs'
      - 'assets/css/**'
      - '_layouts/**'
      - '_includes/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit live desktop and mobile website
        run: node tests/site-visual-audit.cjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-visual-evidence
          path: visual-captures/
          if-no-files-found: warn
