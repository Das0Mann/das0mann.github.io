name: Lecture sensitivity regression

permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'assets/js/lecture-*.js'
      - 'tests/lecture-sensitivity.cjs'
      - 'tests/lecture-presets.cjs'
      - '.github/workflows/lecture-sensitivity.yml'
      - 'lecture/spin-hamiltonians/index.md'
  push:
    branches: [main]
    paths:
      - 'assets/js/lecture-*.js'
      - 'tests/lecture-sensitivity.cjs'
      - 'tests/lecture-presets.cjs'
      - '.github/workflows/lecture-sensitivity.yml'
      - 'lecture/spin-hamiltonians/index.md'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Exercise lecture widgets over parameter sweeps
        run: |
          node tests/lecture-sensitivity.cjs
          node tests/lecture-presets.cjs
