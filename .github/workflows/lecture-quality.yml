name: Lecture learning experience quality
on:
  pull_request:
    paths:
      - '_data/lecture_*.yml'
      - '_includes/lecture-*.html'
      - '_includes/_navigation.html'
      - '_layouts/*.html'
      - 'assets/css/lecture-refresh.css'
      - 'assets/css/iconic.css'
      - 'assets/css/lecture-polish.css'
      - 'assets/css/lecture-audit.css'
      - 'assets/css/lecture-system.css'
      - 'assets/css/lecture-cidnp.css'
      - 'assets/css/site-coherence.css'
      - 'tests/site-integrity.cjs'
      - 'tests/site-browser-audit.cjs'
      - 'about/**'
      - 'research/**'
      - 'publications/**'
      - 'repositories/**'
      - 'news/**'
      - '404.md'
      - 'assets/js/hero-spin.js'
      - 'tests/hero-spin.cjs'
      - 'tests/visual-system.cjs'
      - '_data/navigation.yml'
      - '_includes/icon.html'
      - 'index.md'
      - 'assets/js/lecture-*.js'
      - 'assets/js/privacy-consent.js'
      - 'assets/js/site-interactions.js'
      - 'assets/js/mathjax-config.js'
      - 'assets/js/mathjax-loader.js'
      - 'assets/css/privacy-consent.css'
      - 'assets/css/site-interactions.css'
      - '_includes/_head.html'
      - '_includes/_footer.html'
      - '_includes/_scripts.html'
      - 'privacy/**'
      - 'tests/security.cjs'
      - 'Gemfile'
      - '.github/dependabot.yml'
      - 'lecture/**'
      - 'tests/lecture-*.cjs'
      - '.github/workflows/lecture-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify navigation, concept checks and teaching-model invariants
        run: node tests/lecture-learning.cjs
      - name: Validate all thirteen reviewed chapters and conventions
        run: node tests/lecture-audit.cjs
      - name: Verify chapter storyline, shared type and optional derivations
        run: node tests/lecture-story.cjs
      - name: Audit student-first teaching layout and equation context
        run: node tests/lecture-student-reading.cjs
      - name: Verify animation playback and reduced-motion behavior
        run: node tests/hero-spin.cjs
      - name: Audit analytics consent and legacy dependencies
        run: node tests/security.cjs
      - name: Verify pinned MathJax asset fingerprint
        run: |
          curl --fail --silent --show-error --location --retry 2 https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js -o /tmp/approved-mathjax.js
          actual="sha384-$(openssl dgst -sha384 -binary /tmp/approved-mathjax.js | openssl base64 -A)"
          expected="sha384-M5jmNxKC9EVnuqeMwRHvFuYUE8Hhp0TgBruj/GZRkYtiMrCRgH7yvv5KY+Owi7TW"
          echo "Pinned MathJax: $actual"
          test "$actual" = "$expected"
      - name: Validate photo-CIDNP analytic model and sign conventions
        run: node tests/lecture-cidnp.cjs
      - name: Independently validate rotational diffusion and relaxation model conventions
        run: node tests/lecture-foundations.cjs
      - name: Run existing parameter sensitivity and preset regressions
        run: |
          node tests/lecture-sensitivity.cjs
          node tests/lecture-presets.cjs
      - name: Check all source templates and shared CSS
        run: node tests/site-integrity.cjs
      - name: Build Jekyll pages before review
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Inspect rendered lecture HTML and homepage entry points
        run: node tests/lecture-rendered.cjs
      - name: Verify rendered editorial disclosures on all original lectures
        run: node tests/lecture-audit.cjs --rendered
      - name: Verify continuous narrative and CSS migration in rendered chapters
        run: node tests/lecture-story.cjs --rendered
      - name: Validate rendered one-heading course pages and scientific explanations
        run: node tests/lecture-student-reading.cjs --rendered
      - name: Validate rendered CIDNP widgets and source links
        run: node tests/lecture-cidnp.cjs --rendered
      - name: Validate foundational lectures and rotational widget after Jekyll build
        run: node tests/lecture-foundations.cjs --rendered
      - name: Audit published HTML for tracking and browser policies
        run: node tests/security.cjs --rendered
      - name: Validate unified icon and typography system in rendered pages
        run: node tests/visual-system.cjs
      - name: Validate all public routes after Jekyll build
        run: node tests/site-integrity.cjs --rendered

      - name: Install headless Chromium for visual regression checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check actual browser layout on all pages at desktop and mobile sizes
        run: node tests/site-browser-audit.cjs
      - name: Keep screenshots and layout diagnostics for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-visual-audit
          path: visual-audit/
          if-no-files-found: warn
