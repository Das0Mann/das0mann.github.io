# For general help on the options
# http://jekyllrb.com/docs/configuration/

# Site-wide configuration
title: Luca Gerhards
locale: en_GB
url: https://das0mann.github.io

# RSS Feed configuration
name: Luca Gerhards
description: "Luca Gerhards — theoretical chemistry, spin dynamics, quantum biology, and multiscale biomolecular physics."
rss: true

# Jekyll configuration
permalink: /:categories/:title/
post_dir: false
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-coffeescript
  - jekyll-paginate

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

# GitHub-specific settings
gist:
  noscript: false
github: [metadata]
highlighter: rouge
incremental: false
lsi: false
safe: true

# Site owner
owner:
  name: Luca Gerhards
  avatar: sections.png
  bio: "Theoretical chemist | spin dynamics, quantum biology & multiscale modelling"
  email: luca.gerhards@uni-oldenburg.de
  github: Das0Mann
  linkedin: luca-gerhards-979718395
  orcid: "0000-0002-8404-2421"
  scholar: "https://scholar.google.com/citations?user=yVwAUf8AAAAJ&hl=en"
  molspin: "https://molspin.eu"

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "_utilities"]
